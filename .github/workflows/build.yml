name: Build QQDice

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build (rootless)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (Linux)
        uses: Randomblock1/theos-action@main
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-sdks-branch: master

      - name: Bump package version
        id: bump
        run: |
          VERSION="5.2.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build deb
        run: |
          export THEOS="${{ github.workspace }}/theos"
          make clean THEOS_PACKAGE_SCHEME=rootless
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Show package
        run: |
          ls -l packages || true
          for f in packages/*.deb; do dpkg-deb -I "$f"; dpkg-deb -c "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: qqdice-deb
          path: packages/*.deb
